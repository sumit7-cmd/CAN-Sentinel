[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-sentinel"
version = "2.0.0"
description = "SOC-style automotive ECU intrusion detection lab using virtual CAN"
requires-python = ">=3.10"
license = {file = "LICENSE"}

dependencies = [
  "python-can>=4.5,<5",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "PyQt6>=6.7,<7",
  "matplotlib>=3.9,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
